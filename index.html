<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICE — C F E System</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: #66ccff;
        font-family: monospace;
        text-align: center;
        padding-top: 20px;
    }

    iframe {
        width: 100vw;
        height: 90vh;
        border: none;
    }

    h1 {
        font-weight: normal;
        letter-spacing: 2px;
    }
</style>

</head>
<body>

<h1>ICE — C F E System</h1>

<iframe id="stationFrame" src="c.html"></iframe>

<script>
    const stations = ["c.html", "f.html", "e.html"];
    let pos = 0;

    setInterval(() => {
        pos = (pos + 1) % stations.length;
        document.getElementById("stationFrame").src = stations[pos];
    }, 1000);
</script>

</body>
</html>
