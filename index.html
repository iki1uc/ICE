<canvas id="shine" width="900" height="600"></canvas>

<script>
const ctx = document.getElementById("shine").getContext("2d");
let t = 0;

function animate(){
    t += 0.01;
    ctx.clearRect(0,0,900,600);

    const D = window.ICE_DATA;
    const axes = D.OSF_VECTOR.DIR();
    const qi = D.QI;
    const iqq = D.IQQ;

    for(let i=0;i<756;i++){
        const x = 450 + Math.sin(t + i*0.01) * axes.dx * 0.002;
        const y = 300 + Math.cos(t + i*0.01) * axes.dy * 0.002;

        ctx.fillStyle = `rgba(${qi*10}, ${iqq.a*20}, 255, 0.7)`;
        ctx.beginPath();
        ctx.arc(x,y,2,0,Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate();
</script>
