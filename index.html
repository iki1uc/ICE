<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICE — C F E System</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: #66ccff;
        font-family: monospace;
        text-align: center;
        padding-top: 20px;
    }

    iframe {
        width: 100vw;
        height: 90vh;
        border: none;
    }

    h1 {
        font-weight: normal;
        letter-spacing: 2px;
    }
</style>

</head>
<body>

<h1>ICE — C F E System</h1>

<iframe id="stationFrame" src="c.html"></iframe>

<script>
    <script type="module">

import PI from "../PI.js";
import { OSF_VECTOR, ECO_ROOT_VECTOR } from "../OSF.vector";
import { OSF_BEAM, OSF_PHI, OSF_STATION } from "../OUR.js";

async function ICE_CORE() {

    const RAUM = await (await fetch("../RAUM.json")).json();
    const REAL = await (await fetch("../REAL.json")).json();
    const BIL  = await (await fetch("../BIL.json")).json();

    window.ICE_DATA = {
        PI,
        OSF_VECTOR,
        ECO_ROOT_VECTOR,
        OSF_BEAM,
        OSF_PHI,
        OSF_STATION,
        RAUM,
        REAL,
        BIL,
        QI: PI.phiScale(PI.pi),
        IQQ: PI.muShift(PI.vec(1,1))
    };
}

ICE_CORE();


    
    
    const stations = ["c.html", "f.html", "e.html"];
    let pos = 0;

    setInterval(() => {
        pos = (pos + 1) % stations.length;
        document.getElementById("stationFrame").src = stations[pos];
    }, 1000);
</script>

</body>
</html>
